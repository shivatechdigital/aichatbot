services:
  quotation-ai:
    build: .
    container_name: quotation-ai-arena
    ports:
      - "7860:7860"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      LLM_URL: ${LLM_URL:-http://host.docker.internal:3010/v1/chat/completions}
      LLM_MODEL: ${LLM_MODEL:-auto}
      API_KEY: ${API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped